<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>楽ブレお問い合わせ</title>
</head>
<body>
  <main>
    <h1>お問い合わせ</h1>
    <p>以下のボタンを押すと、件名と本文が入力されたメール作成画面が開きます。</p>
    <a id="contact-link" href="#">お問い合わせメールを作成する</a>
  </main>

  <script>
    (function () {
      const recipient = "info.versionk@gmail.com";
      const subject = "楽ブレ問い合わせの件";
      const body = `お問い合わせありがとうございます。

以下をご記載の上、送信ください。

━━━━━━━━━━━
種別：お問い合せ
お名前：
フリガナ：
会社名（任意）：

■連絡先
メールアドレス：
連絡がつく電話番号：

■お問い合わせ内容

━━━━━━━━━━

内容を確認後、このまま送信してください。
確認後、担当者よりメールにてご連絡いたします。`;

      const link = document.getElementById("contact-link");
      link.href = "mailto:" + recipient
        + "?subject=" + encodeURIComponent(subject)
        + "&body=" + encodeURIComponent(body);
    })();
  </script>
</body>
</html>
